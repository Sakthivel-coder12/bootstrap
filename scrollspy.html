<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrollspy Example</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body data-bs-spy="scroll" data-bs-target="#navbar-example" data-bs-offset="50" tabindex="0">

<!-- Navigation -->
<nav id="navbar-example" class="navbar navbar-light bg-light px-3 fixed-top">
  <a class="navbar-brand" href="#">Scrollspy Demo</a>
  <ul class="nav nav-pills">
    <li class="nav-item"><a class="nav-link" href="#section1">Section 1</a></li>
    <li class="nav-item"><a class="nav-link" href="#section2">Section 2</a></li>
    <li class="nav-item"><a class="nav-link" href="#section3">Section 3</a></li>
  </ul>
</nav>

<!-- Page Content -->
<div class="container-fluid" style="margin-top:80px;">
  <div id="section1" class="p-5 bg-primary text-white" style="height:600px;">
    <h1>Section 1</h1>
    <p>Scroll down to see more...</p>
  </div>
  <div id="section2" class="p-5 bg-success text-white" style="height:600px;">
    <h1>Section 2</h1>
    <p>This is Section 2</p>
  </div>
  <div id="section3" class="p-5 bg-danger text-white" style="height:600px;">
    <h1>Section 3</h1>
    <p>This is Section 3</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
