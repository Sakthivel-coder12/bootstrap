<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container mt-8">
        <div class  = "row justify-content-center">
            <div class="col mb-3">
                <label for="principal" class = "form-label">Enter the pricipal amount</label>
                <input type="text" class="form-control" placeholder="Simple intrest" id = "principal">
            </div>
        </div>
        <div class  = "row justify-content-center">

            <div class="col mb-3">
                <label for="rate_intrest" class = "form-label">Enter the rate of inrest</label>
                <input type="text" class="form-control" placeholder="rate of intrest" id = "rate_intrest">
            </div>
        </div>
        <div class  = "row justify-content-center">
            
            <div class="col mb-3">
                <label for="time_period_in_year" class = "form-label"> time_period_in_year</label>
                <input type="text" class="form-control" placeholder="time_period_in_year" id = "time_period_in_year">
            </div>
        </div>
        <div class  = "row justify-content-center">
            
            <div class="col mb-3 gap-2">
                <button type="button" id = "b1" class = "bg-primary">simple inrest</button>
                <button type="button" id = "b2" class = "bg-danger">maturityAmt</button>
            </div>
        </div>
        <div class="answer">
            <p id = "simple_intrest_ans" style="display: none;"></p>
            <p id = "maturityAmt" style="display: none;"></p>
        </div>
    </div>
    <script>
        $(document).ready(function(){
            $("#b1").click(function(){
                let p = $("#principal").val();
                let n = $("#time_period_in_year").val();
                let r = $("#rate_intrest").val();
                let simple_intrest  = p * (1 + (r * n));
                $("#simple_intrest_ans").text(simple_intrest).css("font-weight","bold").show();
            });
            $("#b2").click(function(){
                let p = $("#principal").val();
                let n = $("#time_period_in_year").val();
                let r = $("#rate_intrest").val();
                let simple_intrest  = p * (1 + (r * n));
                let maturityAmt = p + simple_intrest;
                $("#maturityAmt").text(maturityAmt).css("font-weight","bold").show();
            });



        })
    </script>
</body>
</html>
