<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="row m-7 justify-content-center">
            <form action="">
                <div class="row">

                    <div class="col-6">
                        <label for="name" class = "form-label">Name</label>
                        <input type="text" class="form-control" placeholder="Enter the name">
                    </div>
                    <div class="col-6">
                        <label for="email" class = "form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Enter the email">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label for="password" class = "form-label">password</label>
                        <input type="password" class="form-control" placeholder="Enter the password">
                    </div>
                </div>
                <button type="button" class="bg-primary " >Register</button>
            </form>
        </div>
    </div>
</body>
</html>
