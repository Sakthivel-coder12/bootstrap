<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container-sm">
        <div class="mt-6">
            <h1>Horizontal Button Group Menu</h1>
        </div>
        <div class="mt-3 btn-group-horizontal">
            <button type="button" class ="btn btn-secondary text-white">Semester 1</button>
            <button type="button" class ="btn btn-secondary text-white">Semester 2</button>
            <button type="button" class ="btn btn-secondary text-white">Semester 3</button>
        </div>
        <div class="mt-10">
            <h1>Vertical Button Group Menu</h1>
        </div>
        <div class="mt-3 btn-group-vertical">
            <button type="button" class ="btn btn-secondary text-white">Semester 1</button>
            <button type="button" class ="btn btn-secondary text-white">Semester 2</button>
            <button type="button" class ="btn btn-secondary text-white">Semester 3</button>
        </div>
    </div>
</body>
</html>
